aid: completedns
name: CompleteDNS
description: >-
  CompleteDNS is a DNS research platform that tracks nameserver modifications and domain drops, with over twenty years
  of history and billions of recorded changes. The CompleteDNS API exposes domain-scoped lookups that return the
  chronological history of nameserver changes, drop events, and parking status for a given domain. Both a current v2 API
  and a legacy v1 API are available, authenticated by API key.
